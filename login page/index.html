<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Design School</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="left-section">
      <img src="img/login&register_image.png" alt="Login Illustration" />
    </div>
    <div class="right-section">
      <div class="form-box">
        <h2>Welcome to <span>Design School</span></h2>
        <button class="social-btn google">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt=""/> Login with Google
        </button>
        <button class="social-btn facebook">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt=""/> Login with Facebook
        </button>
        <div class="divider">OR</div>
        <form>
          <label>Email</label>
          <div class="input-box">
            <input type="email" placeholder="example@gmail.com" required />
          </div>
          <label>Password</label>
          <div class="input-box password-box">
            <input type="password" id="password" placeholder="" required />
            <span class="toggle-password" onclick="togglePassword()">👁</span>
          </div>
          <div class="options">
            <label><input type="checkbox" /> Remember me</label>
            <a href="#">Forgot Password?</a>
          </div>
          <button type="submit" class="login-btn">Login</button>
        </form>
        <p class="register-link">Don't have an account? <a href="register.html">Register</a></p>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
