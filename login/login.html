<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design School Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="font-family: 'Poppins', sans-serif; background-color: #f4f4f4; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh;">

  <div style="background: #fff; padding: 30px 25px; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); width: 350px; text-align: center; border: 2px solid #e5e5e5;">
    
    <h2 style="margin: 0; font-weight: 400;">Welcome to</h2>
    <h1 style="font-size: 24px; color: #5A4DFF; margin-bottom: 20px;">Design School</h1>

    <button style="display: flex; align-items: center; justify-content: center; width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; background: white; cursor: pointer;">
      <img src="https://img.icons8.com/color/16/000000/google-logo.png" style="margin-right: 8px;"> Login with Google
    </button>

    <button style="display: flex; align-items: center; justify-content: center; width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; background: white; cursor: pointer;">
      <img src="https://img.icons8.com/color/16/000000/facebook.png" style="margin-right: 8px;"> Login with Facebook
    </button>

    <div style="margin: 10px 0; font-size: 14px; color: #666;">or</div>

    <form>
      <div style="text-align: left; margin-bottom: 15px;">
        <label style="display: block; font-size: 14px; margin-bottom: 5px;">Email</label>
        <input type="email" placeholder="example@gmail.com" required 
               style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;">
      </div>

      <div style="text-align: left; margin-bottom: 15px;">
        <label style="display: block; font-size: 14px; margin-bottom: 5px;">Password</label>
        <input type="password" placeholder="••••••••" required
               style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;">
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 15px;">
        <label><input type="checkbox" style="margin-right: 5px;"> Remember me</label>
        <a href="#" style="text-decoration: none; color: #5A4DFF;">Forgot Password?</a>
      </div>

      <button type="submit" style="width: 100%; padding: 10px; border: none; border-radius: 5px; background: #5A4DFF; color: white; font-size: 16px; cursor: pointer;">
        Login
      </button>

      <p style="font-size: 14px; margin-top: 15px;">Don’t have an account? 
        <a href="#" style="color: #5A4DFF; text-decoration: none;">Register</a>
      </p>
    </form>
  </div>
</body>
</html>
